<!doctype html>
<html lang="en"><meta charset="utf-8"><title>EnKeyBoard local input test</title>
<style>
body{font:17px system-ui;max-width:900px;margin:48px auto;background:#f6f7f9;color:#202632}
h1{font-size:28px}textarea,[contenteditable]{box-sizing:border-box;width:100%;min-height:150px;padding:18px;
font:20px system-ui;border:1px solid #ccd2dc;border-radius:10px;background:white;color:#202632}
label{display:block;margin:26px 0 10px}p{color:#667085}
</style>
<h1>EnKeyBoard · local input test</h1><p>This file runs locally. Nothing is submitted or sent. Type at least five letters (custo or itntnal).</p>
<label for="plain">Plain textarea</label><textarea id="plain" aria-label="Plain textarea" spellcheck="false"></textarea>
<label>Rich text / contenteditable</label><div id="rich" contenteditable="true" role="textbox" aria-label="Rich text" spellcheck="false"></div>
</html>
